version: '3.8'

services:
  ephemeral_server:
    build:
      context: .
      dockerfile: Dockerfile.ephemeral_server
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    command: node ephemeral_server.mjs
    ports:
      - "3000:3000" # Map port 3000 in the container to 3000 on the host

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:80" # Map port 80 in the container to 8080 on the host
    depends_on:
      - ephemeral_server
    volumes:
      - /home/carwyn/dev/cognitive_warmup/code/python_generator/output:/usr/share/nginx/html/data